<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./css/football.css"/>

    <title>Document</title>
  </head>

  <body>
    <form>
      <h2>REGISTRATION FORM</h2>
      <div>
        <div>
          <div class="form">
            
          </div>
          <label for="name">Surname :</label>
          <input
            class="box"
            type="text"
            id="Surname"
            placeholder="Enter your Surname"
          />
        </div>
        <div>
          <label for="Middle name">Middle name :</label>
          <input
            class="ball"
            type="text"]
            id="Middle name"
            placeholder="Enter your middle name"
          />
        </div>
        <div>
          <label for="last name">Last name :</label
          ><input
            type="text"
            id="last name"
            placeholder=" Enter your last name"
          />
        </div>
        <div>
          <label for="Email">Email :</label
          ><input type="text" id="Email" placeholder="Enter your email" />
        </div>
        <div>
          <label for="phone number"> Phone number:</label
          ><input
            type="text"
            id="phone number"
            placeholder=" Enter your phone number"
          />
        </div>
        <div>
          <h4>Choose your country from the list</h4>
          <select name="country" id="country">
            <option value="Nigeria">Nigeria</option>
            <option value="Ghana">Ghana</option>
            <option value="India">India</option>
            <option value="Cameroon">Cameroon</option>
            <option value="Libya">Libya</option>
            <option value="Tunisia">Tunisia</option>
            <option value="Uk">Uk</option>
            <option value="Indonesia">Indonesia</option>
            <option value="Canada">Canada</option>
            <option value="Gabon">Gabon</option>
            <option value="South Korea">South Korea</option>
            <option value="Germany">Germany</option>
            <option value="Morocco">Morocco</option>
            <option value="Namibia">Namibia</option>
            <option value="South Africa">South Africa</option>
            <option value="Togo">Togo</option>
            <option value="USA">USA</option>
            <option value="Japan">Japan</option>
            <option value="Ice Land">Ice Land</option>
            <option value="Venezuela">Venezuela</option>
            <option value="France">France</option>
            <option value="China">China</option>
          </select>
        </div>
        <div>
          <h4>Jersey's position/number</h4>
          <input
            type="text"
            id="number"
            placeholder="Choose your Jersey's position/number"
          />
        </div>
        <div>
          <select name="number" id="number">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="11">11</option>
            <option value="8">8</option>
            <option value="6">6</option>
            <option value="4">4</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="12">12</option>
          </select>
        </div>
        <div>
          <h4>Choose your gender</h4>
          <input type="radio" name="gender" id="gender" value="Male" />Male
          <input type="radio" name="gender" id="gender" value="female" />Female
          <h4>Level of career</h4>
          <input type="radio" name="Club" id="Club " value="Club" />U19
          <input type="radio" name="Club" id="Club" value="Club" />U21
          <input type="radio" name="Club" id="Club" value="Club" />Beyond limit
          <input type="radio" name="Club" id="Club" value="Club" /> Ultimate
          <input type="radio" name="Club" id="Club" value="Club" /> Legendary
          <h4>Wages</h4>
          <label for="Salary">Salary:</label>
        </div>
        <div>
          Amount to be paid
          <select name="Amount" id="Money">
            <option value="$50k-$55k">$50k-$55k</option>
            <option value="$55k-$60k">$55k-$60k</option>
            <option value="$60k-$70k">$60k-$70k</option>
            <option value="$70k-$80k">$70k-$80k</option>
            <option value="$80k-$90k">$80k-$90k</option>
          </select>
        </div>

        <button type="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
